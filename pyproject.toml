[project]
name = "bettercomputer"
version = "0.0.1"
description = "A small, fast executor model for computer use: picks a screen element and an action from an intent."
requires-python = ">=3.10"
license = "MIT"
dependencies = [
    "torch>=2.4",
    "transformers>=5.0",
    "peft>=0.17",
    "safetensors",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["bettercomputer"]
